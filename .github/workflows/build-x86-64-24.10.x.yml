name: Build 24.10.x x86-64

on:
  workflow_dispatch:
    inputs:
      luci_version:
        description: "选择luci版本"
        required: true
        default: "24.10.6"
        type: choice
        options:
          - 24.10.0
          - 24.10.1
          - 24.10.2
          - 24.10.3
          - 24.10.4
          - 24.10.5
          - 24.10.6
      custom_router_ip:
        description: "旁路由 IP (请与 iKuai 在同一网段，如 192.168.2.2)"
        required: true
        default: "10.10.10.3"
      main_router_ip:
        description: "主路由 iKuai IP (网关与DNS，如 192.168.2.1)"
        required: true
        default: "10.10.10.2"
      profile:
        description: '选择软件包空间大小'
        required: true
        type: choice
        default: '2G'
        options:
          - '1G'
          - '2G'
          - '3G'
          - '4G'
      enable_store:
        description: "集成 store 商店"
        required: true
        type: boolean
        default: true
      include_docker:
        description: "是否集成 Docker (默认否，极致精简)"
        required: false
        default: 'no'
        type: choice
        options:
          - 'yes'
          - 'no'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Set executable permissions
        run: chmod +x ${{ github.workspace }}/x86-64/build24.sh

      - name: Generate Bypass Router Config (动态注入旁路由设置)
        run: |
          mkdir -p "${{ github.workspace }}/files/etc/uci-defaults"
          cat > "${{ github.workspace }}/files/etc/uci-defaults/99-custom-bypass" <<EOF
          #!/bin/sh
          uci set network.lan.device='eth0'
          uci set network.lan.proto='static'
          uci set network.lan.ipaddr='${{ inputs.custom_router_ip }}'
          uci set network.lan.netmask='255.255.255.0'
          uci set network.lan.gateway='${{ inputs.main_router_ip }}'
          uci add_list network.lan.dns='${{ inputs.main_router_ip }}'
          uci set dhcp.lan.ignore='1'
          uci set firewall.@zone[0].masq='1'
          uci commit network
          uci commit dhcp
          uci commit firewall
          exit 0
          EOF
          chmod +x "${{ github.workspace }}/files/etc/uci-defaults/99-custom-bypass"
          echo "✅ 旁路由开机自启脚本已生成完毕！"
       
      - name: Enable Store integration
        run: |
          if [ "${{ inputs.enable_store }}" == "true" ]; then
            echo 'CUSTOM_PACKAGES="$CUSTOM_PACKAGES luci-app-store"' >> shell/custom-packages.sh
            echo "✅ 已追加 luci-app-store"
          else
            echo "❎ 未启用 luci-app-store"
          fi

      - name: Download NaiLink ipk (本地附加包)
        run: |
          mkdir -p "${{ github.workspace }}/shell/local-ipk"
          BASE="https://github.com/slobys/NaiLink/releases/download/openwrt-v0.6.36"
          wget -q "$BASE/daed-router-0.6.36-x86_64.ipk" -O "${{ github.workspace }}/shell/local-ipk/daed-router-0.6.36-x86_64.ipk"
          wget -q "$BASE/luci-app-daed-router-0.6.36.ipk" -O "${{ github.workspace }}/shell/local-ipk/luci-app-daed-router-0.6.36.ipk"
          ls -lh "${{ github.workspace }}/shell/local-ipk/"
          echo "✅ 本地附加 ipk 下载完成（NaiLink 0.6.36 / x86_64）"

      - name: Build ImmortalWrt-x86-64-efi 24.10.x
        run: |
          profile="${{ inputs.profile }}"
          case "$profile" in
            1G)
              ROOTFS_SIZE=1024
              ;;
            2G)
              ROOTFS_SIZE=2048
              ;;
            3G)
              ROOTFS_SIZE=3072
              ;;
            4G)
              ROOTFS_SIZE=4096
              ;;
          esac
          ROOTFS_SIZE=${ROOTFS_SIZE:-2048}
          echo "ROOTFS_SIZE=$ROOTFS_SIZE" >> $GITHUB_ENV
          luci_version="${{ inputs.luci_version }}"
          include_docker="${{ inputs.include_docker }}"
          echo "Building for rootfs size: $profile (${ROOTFS_SIZE}MB)"
          
          docker run --rm -i \
            --user root \
            -v "${{ github.workspace }}/bin:/home/build/immortalwrt/bin" \
            -v "${{ github.workspace }}/files:/home/build/immortalwrt/files" \
            -v "${{ github.workspace }}/x86-64/imm.config:/home/build/immortalwrt/.config" \
            -v "${{ github.workspace }}/shell:/home/build/immortalwrt/shell" \
            -v "${{ github.workspace }}/x86-64/build24.sh:/home/build/immortalwrt/build.sh" \
            -e PROFILE=$ROOTFS_SIZE \
            -e INCLUDE_DOCKER=$include_docker \
            -e ENABLE_PPPOE=no \
            immortalwrt/imagebuilder:x86-64-openwrt-${luci_version} /bin/bash /home/build/immortalwrt/build.sh
          

      - name: Create info
        run: |
          cat > ${{ github.workspace }}/router-info.md <<EOF
          ## 📡 旁路由后台信息
          <a href="https://wkdaily.cpolar.cn/archives/1">
            <img src="https://img.shields.io/badge/若下载慢可套用国内加速站下载-FC7C0D?logo=github&logoColor=fff&labelColor=000&style=for-the-badge"/>
          </a>
          
          - 🏠 **旁路由后台地址**: ${{ inputs.custom_router_ip }}
          - 🌐 **主路由/网关指向**: ${{ inputs.main_router_ip }}
          - 👤 **用户名**: root
          - 🔑 **密码**: 无
          EOF
          
          if [ "${{ inputs.include_docker }}" == "yes" ]; then
            echo "- 🐳 **Docker**: 已集成" >> ${{ github.workspace }}/router-info.md
          else
            echo "- 🐳 **Docker**: 未集成 (精简版)" >> ${{ github.workspace }}/router-info.md
          fi
          
          echo -e "\n**注意**：刷入开机后，虚拟机内第一张网卡(eth0) 会自动配置好以上 IP 且关闭 DHCP。" >> ${{ github.workspace }}/router-info.md

      - name: Upload ImmortWrt as release assets
        uses: softprops/action-gh-release@v3
        with:
          tag_name: Autobuild-x86-64
          body_path: ${{ github.workspace }}/router-info.md
          files: |
            ${{ github.workspace }}/bin/targets/x86/64/*squashfs-combined-efi.img.gz
          token: ${{ secrets.GITHUB_TOKEN }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
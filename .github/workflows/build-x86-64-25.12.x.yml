name: Build 25.12.x x86-64

on:
  workflow_dispatch:
    inputs:
      luci_version:
        description: "选择luci版本"
        required: true
        default: "25.12.1"
        type: choice
        options:
          - 25.12.0-rc1
          - 25.12.0-rc2
          - 25.12.0
          - 25.12.1
      custom_router_ip:
        description: "旁路由 IP (请与 iKuai 在同一网段，如 10.10.10.3)"
        required: true
        default: "10.10.10.3"
      main_router_ip:
        description: "主路由 iKuai IP (网关与DNS，如 10.10.10.2)"
        required: true
        default: "10.10.10.2"
      profile:
        description: '请输入要编译固件大小 单位(MB)'
        required: true
        default: '1024'
      enable_store:
        description: "集成 store 商店"
        required: false
        type: boolean
        default: false
      include_docker:
        description: "是否集成 Docker (默认否，极致精简)"
        required: false
        default: 'no'
        type: choice
        options:
          - 'yes'
          - 'no'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Set executable permissions
        run: chmod +x ${{ github.workspace }}/x86-64/build25.sh

      - name: Generate Bypass Router Config (动态注入旁路由设置)
        run: |
          mkdir -p "${{ github.workspace }}/files/etc/uci-defaults"
          cat > "${{ github.workspace }}/files/etc/uci-defaults/99-custom-bypass" <<EOF
          #!/bin/sh
          # 由于是直通网卡，在 OpenWrt 内部识别为第一张网卡 eth0
          uci set network.lan.device='eth0'
          uci set network.lan.proto='static'
          uci set network.lan.ipaddr='${{ inputs.custom_router_ip }}'
          uci set network.lan.netmask='255.255.255.0'
          uci set network.lan.gateway='${{ inputs.main_router_ip }}'
          uci add_list network.lan.dns='${{ inputs.main_router_ip }}'
          uci set dhcp.lan.ignore='1'
          uci set firewall.@zone[0].masq='1'
          uci commit network
          uci commit dhcp
          uci commit firewall
          exit 0
          EOF
          chmod +x "${{ github.workspace }}/files/etc/uci-defaults/99-custom-bypass"
          echo "✅ 旁路由开机自启脚本已生成完毕！"
       
      - name: Enable Store integration
        run: |
          if [ "${{ inputs.enable_store }}" == "true" ]; then
            echo 'CUSTOM_PACKAGES="$CUSTOM_PACKAGES luci-app-store"' >> shell/apk-custom-packages.sh
            echo "✅ 已追加 luci-app-store"
          else
            echo "❎ 未启用 luci-app-store"
          fi

      - name: Build ImmortalWrt-x86-64-efi 25.12.x
        run: |
          profile="${{ inputs.profile }}"
          luci_version="${{ inputs.luci_version }}"
          include_docker="${{ inputs.include_docker }}"
          echo "Building for profile: $profile"
          
          docker run --rm -i \
            --user root \
            -v "${{ github.workspace }}/bin:/home/build/immortalwrt/bin" \
            -v "${{ github.workspace }}/files:/home/build/immortalwrt/files" \
            -v "${{ github.workspace }}/x86-64/imm25.config:/home/build/immortalwrt/.config" \
            -v "${{ github.workspace }}/shell:/home/build/immortalwrt/shell" \
            -v "${{ github.workspace }}/x86-64/build25.sh:/home/build/immortalwrt/build.sh" \
            -e PROFILE=$profile \
            -e INCLUDE_DOCKER=$include_docker \
            -e ENABLE_PPPOE=no \
            immortalwrt/imagebuilder:x86-64-openwrt-${luci_version} /bin/bash /home/build/immortalwrt/build.sh
          

      - name: Create info
        run: |
          cat > ${{ github.workspace }}/router-info.md <<EOF
          ## 📡 旁路由后台信息
          <a href="https://wkdaily.cpolar.cn/archives/1">
            <img src="https://img.shields.io/badge/若下载慢可套用国内加速站下载-FC7C0D?logo=github&logoColor=fff&labelColor=000&style=for-the-badge"/>
          </a>
          
          - 🏠 **旁路由后台地址**: ${{ inputs.custom_router_ip }}
          - 🌐 **主路由/网关指向**: ${{ inputs.main_router_ip }}
          - 👤 **用户名**: root
          - 🔑 **密码**: 无
          EOF
          
          if [ "${{ inputs.include_docker }}" == "yes" ]; then
            echo "- 🐳 **Docker**: 已集成" >> ${{ github.workspace }}/router-info.md
          else
            echo "- 🐳 **Docker**: 未集成 (精简版)" >> ${{ github.workspace }}/router-info.md
          fi
          
          echo -e "\n**注意**：刷入开机后，eth0 会自动配置好以上 IP 且关闭 DHCP。" >> ${{ github.workspace }}/router-info.md

      - name: Upload ImmortWrt as release assets
        uses: softprops/action-gh-release@v2
        with:
          tag_name: Autobuild-x86-64
          body_path: ${{ github.workspace }}/router-info.md
          files: |
            ${{ github.workspace }}/bin/targets/x86/64/*squashfs-combined-efi.img.gz
          token: ${{ secrets.GITHUB_TOKEN }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}